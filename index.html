
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopUp King</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{background:#111a30;padding:17px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold;color:#36e6a0}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 14px;font-weight:bold;margin:4px}
.admin{background:#34506d;color:white}
.hero{padding:35px 6%;background:linear-gradient(120deg,#102d40,#182044)}
.hero h1{font-size:30px}
.search,input,select{width:100%;padding:13px;margin:7px 0;background:#101a30;color:white;border:1px solid #34435e;border-radius:7px}
h2{margin:25px 5% 15px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;padding:0 5%}
.card,#adminPanel{background:#17233b;border:1px solid #293957;border-radius:12px;padding:16px}
.price{color:#36e6a0;font-size:20px;font-weight:bold}
.buy{background:#16bd82;color:#071b17;width:100%;margin-top:10px}
#adminPanel{display:none;margin:20px 5%}
.adminItem,.orderItem{padding:13px;border-bottom:1px solid #34435e;margin-bottom:8px;overflow-wrap:anywhere}
.edit{background:#345d9c;color:white}
.danger{background:#d84b55;color:white}
.status{background:#263550;color:white;width:auto}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:center;justify-content:center;padding:15px}
.modalBox{background:#17233b;padding:22px;border-radius:13px;width:100%;max-width:400px}
footer{text-align:center;padding:30px;color:#9cabc1}
</style>
</head>
<body>
<header>
<div class="logo">⚡ TOPUP KING</div>
<button class="admin" onclick="adminLogin()">Admin Login</button>
</header>

<section class="hero">
<h1>Game Top Up সহজেই!</h1>
<p>আপনার পছন্দের গেমের Diamond, UC ও অন্যান্য প্যাকেজ কিনুন।</p>
<input class="search" id="search" placeholder="গেম বা প্যাকেজ খুঁজুন..." oninput="render()">
</section>

<h2>🎮 জনপ্রিয় গেম টপ-আপ</h2>
<div class="products" id="products"></div>

<section id="adminPanel">
<h2 style="margin:5px 0 15px">⚙️ Admin Dashboard</h2>
<h3>পণ্য ব্যবস্থাপনা</h3>
<input id="pname" placeholder="পণ্যের নাম">
<input id="pgame" placeholder="গেমের নাম">
<input id="pprice" type="number" placeholder="দাম (টাকা)">
<button class="buy" onclick="saveProduct()">+ পণ্য যোগ করুন</button>
<h3>পণ্যের তালিকা</h3>
<div id="adminList"></div>
<hr>
<h3>🛒 অর্ডার ম্যানেজমেন্ট</h3>
<p id="orderCount">মোট অর্ডার: ০</p>
<div id="orderList"></div>
<button class="admin" onclick="closeAdmin()">Dashboard বন্ধ করুন</button>
</section>

<div class="modal" id="orderModal">
<div class="modalBox">
<h3>অর্ডার করুন</h3>
<p id="selectedProduct"></p>
<input id="customer" placeholder="আপনার নাম">
<input id="gameID" placeholder="আপনার Game UID">
<input id="phone" placeholder="মোবাইল নম্বর">
<select id="payment">
<option value="">পেমেন্ট পদ্ধতি নির্বাচন করুন</option>
<option>bKash</option>
<option>Nagad</option>
</select>
<button class="buy" onclick="placeOrder()">অর্ডার সাবমিট</button>
<button class="admin" onclick="closeOrder()">বন্ধ করুন</button>
</div>
</div>

<footer>© 2026 TopUp King | All Rights Reserved</footer>

<script>
let products=JSON.parse(localStorage.getItem("tk_products"))||[
{id:1,name:"25 Diamonds",game:"Free Fire",price:25},
{id:2,name:"50 Diamonds",game:"Free Fire",price:40},
{id:3,name:"115 Diamonds",game:"Free Fire",price:85},
{id:4,name:"240 Diamonds",game:"Free Fire",price:165},
{id:5,name:"60 UC",game:"PUBG Mobile",price:120},
{id:6,name:"325 UC",game:"PUBG Mobile",price:590}
];
let orders=JSON.parse(localStorage.getItem("tk_orders"))||[];
let editing=null,selected=null;

function save(){
localStorage.setItem("tk_products",JSON.stringify(products));
localStorage.setItem("tk_orders",JSON.stringify(orders));
}
function render(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("products").innerHTML=products.filter(p=>(p.name+" "+p.game).toLowerCase().includes(q)).map(p=>`
<div class="card">
<small>${p.game}</small><h3>${p.name}</h3>
<div class="price">৳${p.price}</div>
<button class="buy" onclick="openOrder(${p.id})">এখনই কিনুন</button>
</div>`).join("");
}
function adminLogin(){
let pass=prompt("Admin Password লিখুন:");
if(pass==="1234"){
document.getElementById("adminPanel").style.display="block";
adminRender();orderRender();
}else if(pass!==null)alert("ভুল পাসওয়ার্ড!");
}
function adminRender(){
document.getElementById("adminList").innerHTML=products.map(p=>`
<div class="adminItem"><b>${p.game} - ${p.name}</b> | ৳${p.price}<br>
<button class="edit" onclick="editProduct(${p.id})">Edit</button>
<button class="danger" onclick="deleteProduct(${p.id})">Delete</button></div>`).join("");
}
function saveProduct(){
let name=document.getElementById("pname").value.trim();
let game=document.getElementById("pgame").value.trim();
let price=Number(document.getElementById("pprice").value);
if(!name||!game||price<=0)return alert("সব তথ্য সঠিকভাবে পূরণ করুন");
if(editing!==null){
let p=products.find(x=>x.id===editing);
Object.assign(p,{name,game,price});editing=null;
}else products.push({id:Date.now(),name,game,price});
document.getElementById("pname").value="";
document.getElementById("pgame").value="";
document.getElementById("pprice").value="";
save();render();adminRender();
}
function editProduct(id){
let p=products.find(x=>x.id===id);
document.getElementById("pname").value=p.name;
document.getElementById("pgame").value=p.game;
document.getElementById("pprice").value=p.price;
editing=id;
}
function deleteProduct(id){
if(confirm("পণ্যটি মুছে ফেলতে চান?")){
products=products.filter(p=>p.id!==id);
save();render();adminRender();
}
}
function openOrder(id){
selected=products.find(p=>p.id===id);
document.getElementById("selectedProduct").innerText=selected.name+" - ৳"+selected.price;
document.getElementById("orderModal").style.display="flex";
}
function closeOrder(){document.getElementById("orderModal").style.display="none"}
function placeOrder(){
let customer=document.getElementById("customer").value.trim();
let uid=document.getElementById("gameID").value.trim();
let phone=document.getElementById("phone").value.trim();
let payment=document.getElementById("payment").value;
if(!customer||!uid||!phone||!payment)return alert("সব তথ্য পূরণ করুন");
orders.push({
id:Date.now(),customer,product:selected.name,game:selected.game,
price:selected.price,uid,phone,payment,status:"Pending"
});
save();closeOrder();
alert("ডেমো অর্ডার গ্রহণ করা হয়েছে।");
document.getElementById("customer").value="";
document.getElementById("gameID").value="";
document.getElementById("phone").value="";
document.getElementById("payment").value="";
}
function orderRender(){
document.getElementById("orderCount").innerText="মোট অর্ডার: "+orders.length;
document.getElementById("orderList").innerHTML=orders.length?orders.map(o=>`
<div class="orderItem">
<b>অর্ডার #${o.id}</b><br>
ক্রেতা: ${safe(o.customer)}<br>
পণ্য: ${safe(o.game)} - ${safe(o.product)}<br>
দাম: ৳${o.price}<br>
Game UID: ${safe(o.uid)}<br>
মোবাইল: ${safe(o.phone)}<br>
পেমেন্ট: ${safe(o.payment)}<br>
স্ট্যাটাস: <b>${safe(o.status)}</b><br>
<select class="status" onchange="changeStatus(${o.id},this.value)">
<option ${o.status==="Pending"?"selected":""}>Pending</option>
<option ${o.status==="Complete"?"selected":""}>Complete</option>
<option ${o.status==="Cancelled"?"selected":""}>Cancelled</option>
</select>
<button class="danger" onclick="deleteOrder(${o.id})">অর্ডার মুছুন</button>
</div>`).join(""):"এখনো কোনো অর্ডার নেই।";
}
function safe(v){
return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function changeStatus(id,status){
let o=orders.find(x=>x.id===id);
if(o){o.status=status;save();orderRender();}
}
function deleteOrder(id){
if(confirm("এই অর্ডারটি মুছে ফেলবেন?")){
orders=orders.filter(o=>o.id!==id);save();orderRender();
}
}
function closeAdmin(){document.getElementById("adminPanel").style.display="none"}
render();
</script>
</body>
</html>
